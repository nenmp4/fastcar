; 28/09/2026 — achado real: "413 erro reques" logo depois de liberar upload
; de MÚLTIPLAS fotos de uma vez (admin/veiculo_midias.php/venda.php) —
; nginx da VPS nunca teve client_max_body_size configurado (default 1MB,
; ver install/SETUP_VPS.md) e o PHP-FPM padrão do Ubuntu também vem com
; upload_max_filesize/post_max_size pequenos demais (2M/8M) pro que o
; próprio projeto já permite por arquivo (fotos até 10MB, vídeo até 50MB —
; VEICULO_MIDIA_MAX_BYTES_FOTO/_VIDEO, includes/vendas.php).
;
; Estes valores aqui cobrem o PHP; o nginx precisa do MESMO ajuste (não lê
; .user.ini, é camada separada) — ver "client_max_body_size" no server
; block de install/SETUP_VPS.md, aplicado manualmente na VPS via SSH.
; Teto de 95M escolhido pra ficar abaixo do limite de 100MB por
; requisição do Cloudflare no plano Free/Pro (esse projeto roda atrás da
; Cloudflare, ver install/SETUP_VPS.md) — subir mais que isso não
; adiantaria, a Cloudflare rejeitaria antes de chegar na VPS. O código já
; trava um lote de fotos/vídeos em 80MB no total (VEICULO_MIDIA_MAX_BYTES_LOTE,
; includes/vendas.php) — esses 95M dão margem pro overhead do multipart
; (boundaries, headers) sem precisar chegar perto do teto da Cloudflare.
;
; PHP-FPM escaneia .user.ini em toda a árvore de diretório (aqui cobre
; admin/ inteiro) sem precisar mexer no php.ini/pool global — funciona em
; qualquer VPS nova sem passo manual extra, só o cache de
; user_ini.cache_ttl (padrão 300s) precisa expirar (ou reload do PHP-FPM)
; pra valer imediatamente.
upload_max_filesize = 52M
post_max_size = 95M
